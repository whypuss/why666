name: CI Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly upstream sing-box compatibility check (Mondays 03:00 UTC)
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-lint:
    name: Static Check & ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lint tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck jq >/dev/null

      - name: Run static quality & contract gate
        run: bash tests/static_check.sh

  e2e-ubuntu-systemd:
    name: E2E Regression (Ubuntu systemd)
    needs: static-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run full Linux E2E regression suite
        run: sudo bash tests/e2e_linux.sh

  e2e-alpine-openrc:
    name: E2E Compatibility (Alpine OpenRC)
    needs: static-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: alpine:3.20
    steps:
      - name: Install Alpine runtime dependencies
        run: apk add --no-cache bash openrc curl jq ca-certificates git tar openssl >/dev/null

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Alpine BusyBox & OpenRC compatibility suite
        run: bash tests/e2e_alpine.sh

  release-dry-run:
    name: Release Tarball Dry-Run
    needs: static-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release package integrity
        run: bash tests/release_verify.sh --dry-run

  ci-gate:
    name: CI Gate
    needs: [static-and-lint, e2e-ubuntu-systemd, e2e-alpine-openrc, release-dry-run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce all required CI jobs passed
        run: |
          echo "static-and-lint:    ${{ needs.static-and-lint.result }}"
          echo "e2e-ubuntu-systemd: ${{ needs.e2e-ubuntu-systemd.result }}"
          echo "e2e-alpine-openrc:  ${{ needs.e2e-alpine-openrc.result }}"
          echo "release-dry-run:    ${{ needs.release-dry-run.result }}"
          if [[ "${{ needs.static-and-lint.result }}" != "success" \
             || "${{ needs.e2e-ubuntu-systemd.result }}" != "success" \
             || "${{ needs.e2e-alpine-openrc.result }}" != "success" \
             || "${{ needs.release-dry-run.result }}" != "success" ]]; then
            echo "CI Gate blocked: one or more verification jobs failed." >&2
            exit 1
          fi
          echo "CI Gate passed: all regression checks green."
